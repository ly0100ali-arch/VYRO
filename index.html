<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>VYRO</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#f5f6fb;font:16px system-ui,sans-serif}header{padding:18px;background:#151a24;border-bottom:1px solid #293044}.logo{font-size:28px;font-weight:900;letter-spacing:2px;color:#a99eff}main{max-width:650px;margin:22px auto;padding:0 14px}.panel,.post,.stories{background:#151a24;border:1px solid #293044;border-radius:18px;margin-bottom:16px;padding:16px}.stories{display:flex;justify-content:space-around;color:#b9c0ce}.avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#8b7cff,#36c9c2);color:#080a10;font-weight:900}.composer{display:flex;gap:10px}.composer input{flex:1;min-width:0;background:#0b0e14;border:1px solid #293044;border-radius:12px;padding:12px;color:white;font:inherit}button{border:0;border-radius:12px;padding:10px 16px;background:#8b7cff;color:white;font:inherit;cursor:pointer}.posthead{display:flex;align-items:center;gap:10px}.muted{color:#9aa5b5;font-size:12px}.body{white-space:pre-wrap;line-height:1.8;margin:14px 0}.actions{display:flex;gap:10px;border-top:1px solid #293044;padding-top:12px}.actions button{background:transparent;color:#b9c0ce}.active{color:#b3aaff!important}</style></head><body><header><div class="logo">VYRO</div><div class="muted">تواصل بطريقتك</div></header><main><section class="stories"><span>قصتك ＋</span><span>مريم</span><span>عمر</span><span>سارة</span><span>يوسف</span></section><section class="panel"><div class="composer"><input id="txt" maxlength="500" placeholder="بتفكر في إيه؟"><button id="publish">نشر</button></div></section><section id="feed"><article class="post"><div class="posthead"><div class="avatar">V</div><div><b>فريق VYRO</b><div class="muted">منشور ترحيبي</div></div></div><div class="body">أهلاً بيك في VYRO 👋\nمساحة جديدة تجمعنا. شارك أفكارك ولحظاتك مع الناس.</div><div class="actions"><button class="like">♡ إعجاب</button><button class="comment">💬 تعليق</button><button class="share">↗ مشاركة</button></div></article></section><p class="muted" style="text-align:center">نموذج أولي قيد التطوير</p></main><script>const input=document.querySelector('#txt'),feed=document.querySelector('#feed');function actions(el){el.querySelector('.like').onclick=e=>{e.target.classList.toggle('active');e.target.textContent=e.target.classList.contains('active')?'♥ أعجبك':'♡ إعجاب'};el.querySelector('.comment').onclick=()=>{const v=prompt('اكتب تعليقك');if(v)alert('تم تسجيل التعليق في النموذج التجريبي')};el.querySelector('.share').onclick=()=>{if(navigator.share)navigator.share({title:'VYRO',text:el.querySelector('.body').textContent}).catch(()=>{});else alert('ميزة المشاركة التجريبية')}}document.querySelectorAll('.post').forEach(actions);document.querySelector('#publish').onclick=()=>{const v=input.value.trim();if(!v)return;const p=document.createElement('article');p.className='post';p.innerHTML='<div class="posthead"><div class="avatar">أ</div><div><b>أنت</b><div class="muted">الآن</div></div></div><div class="body"></div><div class="actions"><button class="like">♡ إعجاب</button><button class="comment">💬 تعليق</button><button class="share">↗ مشاركة</button></div>';p.querySelector('.body').textContent=v;actions(p);feed.prepend(p);input.value=''};</script></body></html>
